name: MUOC deployment checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: muoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d muoc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/muoc_test
      SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run smoke and integration tests
        run: pytest -q
      - name: Validate required application files
        run: |
          test -f app.py
          test -f requirements.txt
          test -d templates
          test -d static
