name: MineBank deployment checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  deployment-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: muoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d muoc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Validate CC:Tweaked Lua syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          find minecraft/cc_tweaked -maxdepth 1 -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Run MineBank PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/muoc_test
          SECRET_KEY: ci-test-secret
        run: pytest -q tests/test_minebank_postgres.py tests/test_minebank_minecraft.py
      - name: Validate required application files
        run: |
          test -f app.py
          test -f requirements.txt
          test -d templates
          test -d static
