<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MineBank Secure Login</title><link rel="stylesheet" href="{{ url_for('static',filename='css/minebank-rebuilt.css') }}"></head><body class="login-body"><div class="login-card"><div class="public-logo">◆ MineBank <small>The New Bank</small></div><h2>Secure Banking Area</h2><div class="login-status"><span></span> MineBank secure connection</div>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post"><label>Email</label><input type="email" name="email" required><label>Password</label><input type="password" name="password" required>{% if captcha_question %}<label>Security check: {{ captcha_question }}</label><input name="captcha_answer" inputmode="numeric" required>{% endif %}<button id="login-submit" class="button primary full" type="submit"><span class="login-button-label">Access MineBank</span><span class="login-spinner" aria-hidden="true"></span></button></form><p class="center"><a href="{{ url_for('minebank_register') }}">Create a Personal Account</a></p>
<script>
document.querySelector('.login-card form').addEventListener('submit',function(){
  const button=document.getElementById('login-submit');
  if(!button) return;
  button.disabled=true;
  button.classList.add('connecting');
  button.querySelector('.login-button-label').textContent='Establishing secure connection…';
});
</script></div></body></html>
