<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create MineBank Account</title><link rel="stylesheet" href="{{ url_for('static',filename='css/minebank-rebuilt.css') }}"></head><body class="login-body"><div class="login-card wide"><div class="public-logo">◆ MineBank <small>The New Bank</small></div><h2>Create a Personal Account</h2>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post"><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><label>Confirm password</label><input name="password_confirmation" type="password" required><label>6-digit Wallet PIN</label><input name="wallet_pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><p class="hint">Three incorrect Wallet PIN attempts trigger a 5-minute lockout.</p><button class="button primary full">Open Account</button></form></div></body></html>
